name: Build

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Vérifications (Linux)
    runs-on: ubuntu-24.04
    # Un miroir de paquets bloqué ne doit pas occuper la machine pendant 6 heures.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dépendances système de Tauri
        timeout-minutes: 10
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update
          sudo apt-get $APT install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    name: Windows (exe et installateur)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Compilation (exe et installateur)
        run: npx tauri build --bundles nsis

      - name: Exécutable portable, installateur et empreintes SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/giveaway-ig.exe out/GiveawayIG.exe
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName out/GiveawayIG-setup.exe
          $lines = foreach ($name in 'GiveawayIG.exe', 'GiveawayIG-setup.exe') {
            $hash = (Get-FileHash "out/$name" -Algorithm SHA256).Hash.ToLower()
            "$hash  $name"
          }
          $lines | Out-File -Encoding ascii out/SHA256SUMS.txt
          Get-Content out/SHA256SUMS.txt
          "### GiveawayIG.exe`n`nSHA-256 : ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        with:
          name: GiveawayIG-windows
          path: out/
          retention-days: 30

  linux:
    name: AppImage Linux
    # Ubuntu 22.04 : l'AppImage fonctionne ainsi sur les distributions récentes et plus anciennes.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: appimage

      - name: Dépendances système (Tauri et AppImage)
        timeout-minutes: 10
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update
          sudo apt-get $APT install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf file libfuse2

      - run: npm ci

      # tauri.linux.conf.json active la création de l'AppImage sous Linux.
      - name: Compilation (AppImage)
        run: npx tauri build

      - name: AppImage et empreinte SHA-256
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/appimage/*.AppImage out/GiveawayIG-x86_64.AppImage
          chmod +x out/GiveawayIG-x86_64.AppImage
          (cd out && sha256sum GiveawayIG-x86_64.AppImage > SHA256SUMS.txt)
          cat out/SHA256SUMS.txt
          printf '### GiveawayIG-x86_64.AppImage\n\nSHA-256 : `%s`\n' "$(cut -d' ' -f1 out/SHA256SUMS.txt)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: GiveawayIG-linux
          path: out/
          retention-days: 30

name: Release

# Publie un brouillon de release quand un tag v2.x.y est poussé.
# Le brouillon permet de vérifier (et plus tard de signer) l'exécutable avant de le rendre public.
on:
  push:
    tags: ['v2.*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Release Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Le tag correspond à la version de l'application
        shell: bash
        run: |
          app="v$(node -p "require('./package.json').version")"
          conf="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "tag=${GITHUB_REF_NAME} package.json=${app} tauri.conf.json=${conf}"
          test "$app" = "$GITHUB_REF_NAME" && test "$conf" = "$GITHUB_REF_NAME"

      - run: npm ci

      - name: Compilation
        run: npx tauri build --no-bundle

      - name: Exécutable portable et empreinte SHA-256
        id: hash
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/giveaway-ig.exe out/GiveawayIG.exe
          $hash = (Get-FileHash out/GiveawayIG.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  GiveawayIG.exe" | Out-File -Encoding ascii out/SHA256SUMS.txt
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      # Preuve publique que l'exécutable a été compilé ici, depuis ce commit.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/GiveawayIG.exe

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Giveaway IG ${{ github.ref_name }}
          files: |
            out/GiveawayIG.exe
            out/SHA256SUMS.txt
          body: |
            ## Giveaway IG ${{ github.ref_name }}

            **Télécharge `GiveawayIG.exe`** : c'est une application portable, sans installation.
            Range-la dans un dossier à toi (par exemple `Documents\GiveawayIG`) : tes réglages seront enregistrés à côté, dans `GiveawayIG-data`.

            ### Vérifier le fichier
            - SHA-256 : `${{ steps.hash.outputs.sha256 }}`
            - Provenance : `gh attestation verify GiveawayIG.exe --repo ${{ github.repository }}`

            Prérequis : Windows 10 ou 11 avec Microsoft Edge WebView2 (déjà présent sur Windows 11 et sur Windows 10 à jour).

            Projet open source, non affilié à Instant Gaming.

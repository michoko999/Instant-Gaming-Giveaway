name: Release

# Deux façons de publier une version :
# - « Run workflow » dans l'onglet Actions (branche main) : compile Windows et Linux, crée le tag vX.Y.Z
#   à partir de la version de package.json et publie la release (case « brouillon » pour la relire avant) ;
# - pousser un tag v2.x.y : crée un brouillon de release (à relire, et plus tard à signer).
on:
  push:
    tags: ['v2.*']
  workflow_dispatch:
    inputs:
      draft:
        description: "Créer un brouillon au lieu de publier tout de suite"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  prepare:
    name: Version
    # Lancement manuel : uniquement depuis main.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Version de l'application
        id: version
        run: |
          app="v$(node -p "require('./package.json').version")"
          conf="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "package.json=${app} tauri.conf.json=${conf} ref=${GITHUB_REF_NAME}"
          test "$app" = "$conf"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$app" = "$GITHUB_REF_NAME"
          fi
          echo "tag=${app}" >> "$GITHUB_OUTPUT"

      - name: Aucune release existante pour cette version
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::La release ${{ steps.version.outputs.tag }} existe déjà : change la version dans package.json, tauri.conf.json et Cargo.toml."
            exit 1
          fi

  windows:
    name: Windows (exe et installateur)
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Compilation (exe et installateur)
        run: npx tauri build --bundles nsis

      - name: Exécutable portable et installateur
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/giveaway-ig.exe out/GiveawayIG.exe
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName out/GiveawayIG-setup.exe

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            out/GiveawayIG.exe
            out/GiveawayIG-setup.exe
          retention-days: 7

  linux:
    name: AppImage Linux
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Dépendances système (Tauri et AppImage)
        timeout-minutes: 10
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update
          sudo apt-get $APT install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf file libfuse2

      - run: npm ci

      - name: Compilation (AppImage)
        run: npx tauri build

      - name: AppImage
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/appimage/*.AppImage out/GiveawayIG-x86_64.AppImage
          chmod +x out/GiveawayIG-x86_64.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: out/GiveawayIG-x86_64.AppImage
          retention-days: 7

  publish:
    name: Publication
    needs: [prepare, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: out

      - name: Empreintes SHA-256
        id: hash
        run: |
          cd out
          chmod +x GiveawayIG-x86_64.AppImage
          sha256sum GiveawayIG-setup.exe GiveawayIG.exe GiveawayIG-x86_64.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "setup=$(sha256sum GiveawayIG-setup.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "windows=$(sha256sum GiveawayIG.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux=$(sha256sum GiveawayIG-x86_64.AppImage | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Preuve publique que les deux fichiers ont été compilés ici, depuis ce commit.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            out/GiveawayIG-setup.exe
            out/GiveawayIG.exe
            out/GiveawayIG-x86_64.AppImage

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'push' || inputs.draft }}
          make_latest: ${{ github.event_name == 'workflow_dispatch' && !inputs.draft }}
          name: Giveaway IG ${{ needs.prepare.outputs.tag }}
          files: |
            out/GiveawayIG-setup.exe
            out/GiveawayIG.exe
            out/GiveawayIG-x86_64.AppImage
            out/SHA256SUMS.txt
          body: |
            ## Giveaway IG ${{ needs.prepare.outputs.tag }}

            | | Fichier · File |
            |:--|:--|
            | 🪟 **Windows 10 / 11** : installateur · *installer* | `GiveawayIG-setup.exe` |
            | 🪟 **Windows 10 / 11** : portable | `GiveawayIG.exe` |
            | 🐧 **Linux** (x86_64) | `GiveawayIG-x86_64.AppImage` |

            **Windows, installateur** : lance `GiveawayIG-setup.exe`. Pas besoin de droits administrateur ; l'application arrive dans le menu Démarrer et se désinstalle depuis les Paramètres de Windows.
            *Installer: run `GiveawayIG-setup.exe`. No admin rights needed; the app appears in the Start menu and can be uninstalled from Windows Settings.*

            **Windows, portable** : sans installation. Range `GiveawayIG.exe` dans un dossier à toi (par exemple `Documents\GiveawayIG`) : tes réglages seront enregistrés à côté, dans `GiveawayIG-data`.
            *Portable app, no installation: put `GiveawayIG.exe` in a folder of your own; your settings are saved next to it, in `GiveawayIG-data`.*

            **Scoop** : `scoop bucket add giveaway-ig https://github.com/${{ github.repository }}` puis · *then* `scoop install giveaway-ig`.

            **Linux** : rends le fichier exécutable puis lance-le · *make the file executable, then run it*:
            ```bash
            chmod +x GiveawayIG-x86_64.AppImage
            ./GiveawayIG-x86_64.AppImage
            ```
            Les réglages sont enregistrés à côté du fichier, dans `GiveawayIG-data` · *settings are saved next to the file.*

            ### Vérifier les fichiers · Check the files
            - `GiveawayIG-setup.exe` : `${{ steps.hash.outputs.setup }}`
            - `GiveawayIG.exe` : `${{ steps.hash.outputs.windows }}`
            - `GiveawayIG-x86_64.AppImage` : `${{ steps.hash.outputs.linux }}`
            - Provenance : `gh attestation verify <fichier> --repo ${{ github.repository }}`

            Windows : Microsoft Edge WebView2 (déjà présent sur Windows 11 et Windows 10 à jour · *built into Windows 11 and up-to-date Windows 10*).

            Documentation : [README](https://github.com/${{ github.repository }}#readme) (7 langues · 7 languages) · [Code signing policy](https://github.com/${{ github.repository }}/blob/main/docs/CODE_SIGNING_POLICY.md).

            Projet open source, non affilié à Instant Gaming · *Open source project, not affiliated with Instant Gaming.*

      # Bucket Scoop : `bucket/giveaway-ig.json` est mis à jour sur main après chaque publication,
      # pour que `scoop update giveaway-ig` propose la nouvelle version.
      - uses: actions/checkout@v7
        if: github.event_name == 'workflow_dispatch' && !inputs.draft
        with:
          ref: main
          path: repo

      - name: Manifeste Scoop
        if: github.event_name == 'workflow_dispatch' && !inputs.draft
        continue-on-error: true
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          HASH: ${{ steps.hash.outputs.windows }}
          REPO: ${{ github.repository }}
        working-directory: repo
        run: |
          mkdir -p bucket
          python3 - <<'PY'
          import json, os
          tag, repo = os.environ["TAG"], os.environ["REPO"]
          base = f"https://github.com/{repo}/releases/download"
          manifest = {
              "version": tag.lstrip("v"),
              "description": "Keeps track of Instant Gaming giveaways and helps you enter them every month (automatic or manual mode).",
              "homepage": f"https://github.com/{repo}",
              "license": "MIT",
              "architecture": {"64bit": {"url": f"{base}/{tag}/GiveawayIG.exe", "hash": os.environ["HASH"]}},
              "shortcuts": [["GiveawayIG.exe", "Giveaway IG"]],
              "persist": "GiveawayIG-data",
              "checkver": {"github": f"https://github.com/{repo}"},
              "autoupdate": {
                  "architecture": {"64bit": {"url": f"{base}/v$version/GiveawayIG.exe"}},
                  "hash": {"url": "$baseurl/SHA256SUMS.txt"},
              },
          }
          with open("bucket/giveaway-ig.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=4, ensure_ascii=False)
              f.write("\n")
          PY
          cat bucket/giveaway-ig.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/giveaway-ig.json
          git diff --cached --quiet && exit 0
          git commit -m "Scoop : giveaway-ig ${TAG}"
          git push origin HEAD:main

  # Envoi sur winget (ignoré tant que le secret WINGET_TOKEN n'existe pas).
  winget:
    name: Winget
    needs: [prepare, publish]
    if: github.event_name == 'workflow_dispatch' && !inputs.draft
    permissions:
      contents: read
    uses: ./.github/workflows/winget.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
